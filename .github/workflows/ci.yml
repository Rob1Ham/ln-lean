name: CI

on:
  push:
    branches: [main, "repair/**"]
  pull_request:
    branches: [main, "repair/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Pinned in refs/PINNED.md. The anchor checker reads refs/rust-lightning.
  RUST_LIGHTNING_SHA: fe4900930c6bd5786ec4203274d7cf312776a5a6
  # Optional vendor provisioning inputs (OPS-01). The pinned btc-lean snapshot
  # f950806 is not in public btc-lean history, so the build input must be
  # supplied explicitly. After a maintainer publishes a checksummed archive,
  # set the repository variables VENDOR_ARTIFACT_URL and
  # VENDOR_ARTIFACT_SHA256. On a self-hosted runner, VENDOR_ARTIFACT_PATH may
  # point at the archive instead. Setting REQUIRE_VENDOR_BUILD=true turns a
  # missing snapshot from an explicit skip into a job failure.
  VENDOR_ARTIFACT_URL: ${{ vars.VENDOR_ARTIFACT_URL }}
  VENDOR_ARTIFACT_SHA256: ${{ vars.VENDOR_ARTIFACT_SHA256 }}
  VENDOR_ARTIFACT_PATH: ${{ vars.VENDOR_ARTIFACT_PATH }}
  REQUIRE_VENDOR_BUILD: ${{ vars.REQUIRE_VENDOR_BUILD }}

jobs:
  source-gates:
    name: Source-level gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check obligation catalog (strict audit)
        run: python3 scripts/check-catalog.py --audit

      - name: Check forbidden constructs, sorry markers, and duplicate ids
        run: ./scripts/check.sh

      - name: Check file selection and root imports
        run: python3 scripts/check-final.py

      - name: Check wire conformance vectors
        run: python3 scripts/check-conformance.py

      - name: Check shell script syntax
        run: |
          bash -n scripts/fetch-vendor.sh scripts/verify-vendor.sh
          test -x scripts/fetch-vendor.sh
          test -x scripts/verify-vendor.sh

      - name: Fetch pinned rust-lightning reference for anchor checks
        run: |
          set -euo pipefail
          mkdir -p refs
          if [ ! -d refs/rust-lightning/.git ]; then
            git init -q refs/rust-lightning
            git -C refs/rust-lightning remote add origin \
              https://github.com/lightningdevkit/rust-lightning.git
          fi
          git -C refs/rust-lightning fetch --depth 1 origin "$RUST_LIGHTNING_SHA"
          git -C refs/rust-lightning checkout -q --detach FETCH_HEAD

      - name: Check BOLT/LDK path:line anchors
        run: python3 scripts/verify-anchors.py

  build:
    name: Build gate (pinned vendor snapshot required)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # fetch-vendor.sh uses Python 3.12 for safe archive extraction.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vendor/btc-lean-core is gitignored, and its pinned snapshot is not in
      # public btc-lean history (OPS-01). This step either provisions the
      # snapshot from an explicitly configured, checksummed artifact and
      # verifies every file against vendor/VENDOR-SHA256, or records an
      # explicit skip. Exit code 3 is the "no input supplied" gate; any other
      # failure (bad archive, checksum mismatch, misconfiguration) fails CI.
      - name: Provision or verify the pinned vendor snapshot
        id: vendor
        run: |
          set +e
          ./scripts/fetch-vendor.sh --ci
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Pinned vendor snapshot provisioned and verified against vendor/VENDOR-SHA256." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "available=false" >> "$GITHUB_OUTPUT"
              {
                echo "## Full build not run: pinned vendor snapshot unavailable"
                echo ""
                echo "The build input \`vendor/btc-lean-core\` is gitignored, and the pinned"
                echo "commit \`f95080638ae571a3664f4f41b9b6f6b4cfa7c5eb\` is not in public"
                echo "\`Rob1Ham/btc-lean\` history (OPS-01)."
                echo ""
                echo "The \`source-gates\` job still ran and is the required CI signal."
                echo "**This run is not evidence that the tree builds.**"
                echo ""
                echo "To enable this job, publish a checksummed snapshot archive and set"
                echo "the repository variables \`VENDOR_ARTIFACT_URL\` and"
                echo "\`VENDOR_ARTIFACT_SHA256\`; on a self-hosted runner, set"
                echo "\`VENDOR_ARTIFACT_PATH\` instead. Every input is verified against"
                echo "\`vendor/VENDOR-SHA256\` (119 files) before installation."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Full build not run::vendor/btc-lean-core is unavailable; the pinned f950806 snapshot is not public (OPS-01). See the job summary for the provisioning options."
              require="${REQUIRE_VENDOR_BUILD:-false}"
              case "${require,,}" in
                true|1|yes)
                  echo "::error title=Vendor build required::REQUIRE_VENDOR_BUILD=$require but the pinned vendor snapshot is unavailable."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "fetch-vendor.sh failed with exit code $rc" >&2
              exit "$rc"
              ;;
          esac

      - name: Verify vendored snapshot checksums
        if: steps.vendor.outputs.available == 'true'
        run: ./scripts/verify-vendor.sh

      - name: Install pinned Lean toolchain and run lake build
        if: steps.vendor.outputs.available == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false

      - name: Record build result
        if: steps.vendor.outputs.available == 'true'
        run: |
          echo "Full build ran with the pinned vendor snapshot (\`f950806\`)." \
            >> "$GITHUB_STEP_SUMMARY"
