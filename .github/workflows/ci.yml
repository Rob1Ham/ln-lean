name: CI

on:
  push:
    branches: [main, "repair/**"]
  pull_request:
    branches: [main, "repair/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Pinned in refs/PINNED.md. The anchor checker reads refs/rust-lightning.
  RUST_LIGHTNING_SHA: fe4900930c6bd5786ec4203274d7cf312776a5a6
  # vendor/btc-lean-core is gitignored. The build job provisionally fetches the
  # exact pinned public btc-lean commit (4f5c4f8) and verifies its spec/core
  # tree against vendor/VENDOR-SHA256. Optional repository variables may point
  # at a checksummed archive for offline or self-hosted runs; when present
  # they take precedence over the public git fetch.
  VENDOR_ARTIFACT_URL: ${{ vars.VENDOR_ARTIFACT_URL }}
  VENDOR_ARTIFACT_SHA256: ${{ vars.VENDOR_ARTIFACT_SHA256 }}
  VENDOR_ARTIFACT_PATH: ${{ vars.VENDOR_ARTIFACT_PATH }}

jobs:
  source-gates:
    name: Source-level gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check obligation catalog (strict audit)
        run: python3 scripts/check-catalog.py --audit

      - name: Check forbidden constructs, sorry markers, and duplicate ids
        run: ./scripts/check.sh

      - name: Check file selection and root imports
        run: python3 scripts/check-final.py

      - name: Check wire conformance vectors
        run: python3 scripts/check-conformance.py

      - name: Check shell script syntax
        run: |
          bash -n scripts/fetch-vendor.sh scripts/verify-vendor.sh
          test -x scripts/fetch-vendor.sh
          test -x scripts/verify-vendor.sh

      - name: Fetch pinned rust-lightning reference for anchor checks
        run: |
          set -euo pipefail
          mkdir -p refs
          if [ ! -d refs/rust-lightning/.git ]; then
            git init -q refs/rust-lightning
            git -C refs/rust-lightning remote add origin \
              https://github.com/lightningdevkit/rust-lightning.git
          fi
          git -C refs/rust-lightning fetch --depth 1 origin "$RUST_LIGHTNING_SHA"
          git -C refs/rust-lightning checkout -q --detach FETCH_HEAD

      - name: Check BOLT/LDK path:line anchors
        run: python3 scripts/verify-anchors.py

  build:
    name: Build gate (pinned vendor snapshot required)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # fetch-vendor.sh uses Python 3.12 for safe archive extraction.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vendor/btc-lean-core is gitignored. Prefer an explicitly configured
      # checksummed artifact; otherwise fetch the exact pinned public commit.
      # Every path is verified against vendor/VENDOR-SHA256 before the build.
      - name: Provision or verify the pinned vendor snapshot
        run: |
          if [ -n "${VENDOR_ARTIFACT_URL:-}" ] || [ -n "${VENDOR_ARTIFACT_PATH:-}" ]; then
            ./scripts/fetch-vendor.sh --ci
          elif [ -f vendor/btc-lean-core/lakefile.lean ]; then
            ./scripts/fetch-vendor.sh --check
          else
            ./scripts/fetch-vendor.sh --from-git
          fi
          echo "Pinned vendor snapshot provisioned and verified against vendor/VENDOR-SHA256." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify vendored snapshot checksums
        run: ./scripts/verify-vendor.sh

      - name: Install pinned Lean toolchain and run lake build
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false

      - name: Record build result
        run: |
          echo "Full build ran with the pinned vendor snapshot (\`4f5c4f8\`)." \
            >> "$GITHUB_STEP_SUMMARY"
